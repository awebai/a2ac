title: Agent-to-Agent Communication
description: An open guide to how AI agents talk to each other
url: https://a2ac.dev

theme: just-the-docs

search_enabled: true
heading_anchors: true

color_scheme: dark

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - reddit-post.md
  - AGENTS.md
  - res/
  - Gemfile
  - Gemfile.lock
  - "*.gemspec"
